# Recipe for building a Number Guessing Game AppImage.
# See https://appimage-builder.readthedocs.io for full recipe syntax.

version: 1
script: ./scripts/appimage-setup.sh

AppDir:
  path: ./AppDir

  app_info:
    id: com.project516.NumberGuessingGame
    name: NumberGuessingGame
    icon: numberguessinggame
    version: latest
    exec: usr/bin/run.sh
    exec_args: "$@"

  apt:
    arch: amd64
    allow_unauthenticated: true
    sources:
      - sourceline: deb http://archive.ubuntu.com/ubuntu/ noble main restricted universe multiverse
    include:
      - openjdk-17-jre-headless

  runtime:
    version: v2.0.0

AppImage:
  arch: x86_64
  update-information: gh-releases-zsync|Project516|NumberGuessingGame|latest|*x86_64.AppImage.zsync